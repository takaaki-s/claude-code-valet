# `version` below is the CONFIG SCHEMA version, not the tool version. It only
# moves when golangci-lint makes a breaking change to the config format. The
# tool version is pinned in Makefile's GOLANGCI_LINT_VERSION and in the
# `version:` input of golangci-lint-action in .github/workflows/{ci,release}.yml;
# all three move together.
#
# Both exclusions below restore what v1 silenced by default — 40 errcheck and 6
# staticcheck issues — on code that has not changed.
version: "2"

run:
  # `render` is internal/tui/model_render_test.go, the in-process View() harness
  # that exists so a layout change never has to be eyeballed by starting `jin
  # ui` against the user's real tmux server. It skips itself unless pointed at
  # an isolated daemon, so no target RUNS it — but a tagged file no target even
  # COMPILES rots, and the one it rots under is the person told not to use `jin
  # ui`. Listing it here type-checks it on every lint, which is the only bound
  # it needs.
  #
  # This lives here rather than as a `go vet -tags render` line in the Makefile
  # because CI does not go through `make lint` (it runs golangci-lint-action) or
  # `make test` (it runs `go test -race`), so a Makefile-only guard would hold
  # locally and nowhere else. `e2e` is absent on purpose: it has its own
  # Makefile target and its own CI job, which compile and run it for real.
  build-tags:
    - render

linters:
  enable:
    # Enforces internal/procgroup. See settings.forbidigo below.
    - forbidigo

  settings:
    forbidigo:
      forbid:
        # exec.CommandContext cancels by signalling the leader PID, and every
        # process this project starts is a script or CLI that starts more, so
        # "the leader is gone" and "the work has stopped" are different
        # statements. internal/procgroup.CommandContext is the same call with
        # the process group wired up.
        #
        # This is a linter rather than a note in docs/conventions.md because
        # the note was already there and did not hold: procgroup began as a
        # KillOnCancel you were meant to remember after building the command,
        # and a call site was missed for a release — forgetting it produces a
        # process that works, so nothing failed until someone went looking.
        #
        # It also makes the audit decidable. Grepping for exec.CommandContext
        # used to hit every correct site too, so each one had to be read
        # forward a few lines; now any hit outside internal/procgroup is the
        # finding.
        # The sibling rule for JIN_DEBUG is not here, and the reason is worth
        # recording: forbidigo matches the function expression only, so
        # `^os\.Getenv$` is the finest pattern available and it would forbid
        # every environment read in the project. Measured by putting the
        # violation back — a pattern carrying the argument matches nothing at
        # all, which is indistinguishable from a clean tree. That rule lives in
        # internal/debug's tests instead.
        - pattern: '^exec\.CommandContext$'
          msg: use procgroup.CommandContext, which puts the child in its own process group

  exclusions:
    presets:
      # Restores v1's built-in EXC0001, which matched (case-insensitively)
      # errcheck on `(os.)?std(out|err).*`, `.*Close`, `.*Flush`,
      # `os.Remove(All)?`, `.*print(f|ln)?` and `os.(Un)?Setenv`.
      #
      # errcheck matches on message text, so this cannot spare the one case
      # that must stay checked — a `defer f.Close()` that is the only thing
      # flushing what you wrote. That rule lives in docs/conventions.md, which
      # also covers what is safe to leave unchecked and why.
      - std-error-handling

    rules:
      # internal/procgroup is where the sanctioned call lives, and its own
      # tests have to build a bare command to have something to compare
      # against — a negative control that went through the constructor would
      # prove nothing. Scoped to this one package: anywhere else, a test that
      # starts a process leaks it exactly like production would.
      - linters:
          - forbidigo
        path: 'internal/procgroup/'

      # staticcheck's QF ("quickfix") checks are refactoring suggestions, not
      # defect detection, and we do not gate CI on them anywhere in the repo.
      # v1 never ran them; v2 folded gosimple, stylecheck and quickfix into the
      # staticcheck linter, which turned them on. Excluding the family rather
      # than naming individual checks keeps this stable as upstream adds new
      # QF checks.
      #
      # Doing this through linters.settings.staticcheck.checks instead would
      # REPLACE upstream's default check list and silently re-enable ST1000
      # and ST1021.
      - linters:
          - staticcheck
        text: "^QF"
