# `version` below is the CONFIG SCHEMA version, not the tool version. The tool
# version is pinned in Makefile's GOLANGCI_LINT_VERSION and in the `version:`
# input of golangci-lint-action in .github/workflows/{ci,release}.yml; all three
# move together.
version: "2"

run:
  # A tagged file is invisible to every linter unless its tag is listed here,
  # and everything listed is enabled at once — so files under different tags in
  # the same package have to co-compile, which no test target ever asks of them.
  # A collision surfaces as a `typecheck` issue from the lint job and as nothing
  # at all from any test, so `go vet -tags "render e2e" ./...` is how to look for
  # one before adding a third tag.
  #
  # Both are here because no linter otherwise reads them. `render` is
  # internal/tui/model_render_test.go, which skips itself unless pointed at an
  # isolated daemon, so no target runs it and a tagged file no target compiles
  # rots. `e2e` is compiled and run by `make test-e2e`, but beyond the vet subset
  # `go test` runs on its own nothing held it to the rules the rest of the tree
  # is held to, and an errcheck it had drifted into went unreported.
  build-tags:
    - render
    - e2e

linters:
  enable:
    # Enforces internal/procgroup. See settings.forbidigo below.
    - forbidigo

  settings:
    forbidigo:
      forbid:
        # exec.CommandContext cancels by signalling the leader PID, and every
        # process this project starts is a script or CLI that starts more, so
        # "the leader is gone" and "the work has stopped" are different
        # statements. internal/procgroup.CommandContext is the same call with
        # the process group wired up.
        #
        # A linter rather than a note in docs/conventions.md because the note
        # was already there and did not hold: forgetting the wiring produces a
        # process that works, so nothing failed until someone went looking.
        #
        # The sibling rule for JIN_DEBUG is not here: forbidigo matches the
        # function expression only, so `^os\.Getenv$` is the finest pattern
        # available and would forbid every environment read in the project. A
        # pattern carrying the argument was measured to match nothing at all,
        # which is indistinguishable from a clean tree. That rule lives in
        # internal/debug's tests instead.
        - pattern: '^exec\.CommandContext$'
          msg: use procgroup.CommandContext, which puts the child in its own process group

  exclusions:
    presets:
      # Restores v1's built-in EXC0001, which matched (case-insensitively)
      # errcheck on `(os.)?std(out|err).*`, `.*Close`, `.*Flush`,
      # `os.Remove(All)?`, `.*print(f|ln)?` and `os.(Un)?Setenv`.
      #
      # errcheck matches on message text, so this cannot spare the one case that
      # must stay checked — a `defer f.Close()` that is the only thing flushing
      # what you wrote. That rule lives in docs/conventions.md.
      - std-error-handling

    rules:
      # internal/procgroup is where the sanctioned call lives, and its own tests
      # have to build a bare command to have something to compare against.
      # Scoped to this one package: anywhere else, a test that starts a process
      # leaks it exactly like production would.
      - linters:
          - forbidigo
        path: 'internal/procgroup/'

      # staticcheck's QF ("quickfix") checks are refactoring suggestions, not
      # defect detection, and CI is not gated on them anywhere in the repo.
      # Excluding the family rather than naming individual checks keeps this
      # stable as upstream adds new QF checks.
      #
      # Doing this through linters.settings.staticcheck.checks instead would
      # REPLACE upstream's default check list and silently re-enable ST1000
      # and ST1021.
      - linters:
          - staticcheck
        text: "^QF"
