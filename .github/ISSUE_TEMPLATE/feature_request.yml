name: Feature request
description: Suggest a change in behaviour or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please open a request here **before** writing code. Pull requests for
        new features that were not discussed first may be declined even when the
        code is good.

        This project keeps its scope deliberately narrow so that one maintainer
        can sustain it. A request may be closed as out of scope — that is a
        statement about the project's boundaries, not about your idea.

        See [CONTRIBUTING.md](https://github.com/takaaki-s/jind-ai/blob/main/CONTRIBUTING.md)
        for what is in and out of scope.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before requesting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I read the "Out of scope" section of CONTRIBUTING.md.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. This is the most important field.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How do you handle it today?
      description: Current workaround, if any, and why it is not good enough.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. If you have a concrete idea, describe it here.

  - type: dropdown
    id: willing
    attributes:
      label: Would you be willing to implement this?
      description: Not required — this only helps with planning.
      options:
        - "Yes, if the approach is agreed on first"
        - "Maybe, with guidance"
        - "No, this is a suggestion only"
    validations:
      required: true
